services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      ARTIFACT_DIR: /data/artifacts
      PYTHON_BIN: python
      CLIENT_ORIGIN: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  mongo-data:
  artifacts:
